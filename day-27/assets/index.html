<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 27: Embedded Assets</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <div class="container">
        <h1>Hello from embedded assets!</h1>
        <p>This page is served from an <code>//go:embed</code> filesystem baked into the binary.</p>
        <p>No external files required at runtime.</p>
        <ul>
            <li>Build for prod: <code>go build -tags prod .</code></li>
            <li>Run (dev, reads disk): <code>go run .</code></li>
            <li>Run (prod, embedded): <code>go run -tags prod .</code></li>
        </ul>
    </div>
</body>
</html>
